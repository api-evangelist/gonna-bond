apis:
- aid: gonna-bond:legit-trust-api
  name: LEGIT Trust API
  description: >-
    REST API for the LEGIT trust oracle: trust-check one x402 merchant address (score, grade, uptime, latency,
    explanation), pull a deep report with 30-day history and percentile, batch-check up to 20 addresses,
    get a best-merchant routing recommendation for a stated need, resolve on-chain merchant identity, read
    the ranked leaderboard, trending merchants, per-chain network health, receipts and the live network
    pulse. Five verdict endpoints (compare, arena, history, watch, deep-check) answer HTTP 402 with an x402
    v2 PaymentRequired document and are paid per call in USDC (algorand-mainnet $0.004, base-mainnet $0.005);
    everything else is free with no authentication. 24 operations across 24 paths, published as OpenAPI
    3.1.0 at https://legit.gonna.bond/openapi.json; the spec declares no servers[] and the base URL is the
    host the provider's own llms.txt examples call.
  humanURL: https://legit.gonna.bond/docs
  baseURL: https://legit.gonna.bond
  tags:
  - Trust
  - Merchant Trust
  - x402
  - Agentic Commerce
  - Payments
  - Webhook
  tags_raw:
