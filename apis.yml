aid: gonna-bond
name: GONNA
description: >-
  GONNA is an Algorand-native meme-coin and games community ($GONNA, Algorand ASA 2582294183; the "GONNAVERSE"
  at gonna.bond) that builds and operates LEGIT, a trust oracle for the x402 agentic economy at
  legit.gonna.bond. LEGIT trust-checks any x402 merchant or agent address across Algorand, Base, Solana and
  17 other chains before a payment is routed: grades (A+ to F) and scores (0-100) are built from live
  uptime, latency and payment-coherence probes rather than self-reported data. The surface is exposed three
  ways from one host: a 24-operation OpenAPI 3.1.0 REST contract at https://legit.gonna.bond/openapi.json
  (free reads; five verdict endpoints paid per call in USDC over x402, $0.004 on Algorand / $0.005 on Base,
  no accounts or API keys), a remote MCP server at https://legit.gonna.bond/mcp answering an anonymous
  tools/list with four tools, and an A2A-style agent card at /.well-known/agent.json and
  /.well-known/agent-card.json. The apex site gonna.bond is a JavaScript-rendered community page with no
  API surface of its own.
