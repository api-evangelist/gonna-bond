- aid: gonna-bond:legit-mcp-server
  name: LEGIT MCP Server
  description: >-
    Remote Model Context Protocol server at https://legit.gonna.bond/mcp (stateless JSON-RPC 2.0 over HTTP
    POST; initialize reports protocolVersion 2024-11-05, serverInfo legit 1.0.0, capabilities tools only).
    tools/list answers anonymously with four tools carrying real inputSchema: check_trust, compare_merchants,
    leaderboard and get_badge_url. No authentication, no API keys; a GET on the endpoint returns a
    self-description naming the four tools and pointing at llms.txt for the client config.
  humanURL: https://legit.gonna.bond/llms.txt
  baseURL: https://legit.gonna.bond/mcp
  tags:
  - MCP
  - agent-native
  - Trust
  properties:
  - type: MCPServer
    url: mcp/gonna-bond-mcp.yml
  - type: MCPServer
    name: LEGIT MCP endpoint (JSON-RPC 2.0 over HTTP POST)
    url: https://legit.gonna.bond/mcp
  - type: ToolCrosswalk
    url: mcp/gonna-bond-tool-crosswalk.yml
- aid: gonna-bond:legit-a2a-agent
  name: LEGIT A2A Agent Card
  description: >-
    Agent card served from https://legit.gonna.bond/.well-known/agent.json and, byte-identical, from the
    canonical /.well-known/agent-card.json: name LEGIT, version 0.1.0, provider organization GONNA,
    capabilities {streaming false, pushNotifications false}, an authentication block declaring the x402
    scheme, and ten skills that are REST paths (/v1/check/{address}, /v1/compare, /v1/arena, /v1/history,
    /v1/watch, /v1/deep-check, /v1/leaderboard, /v1/route, /v1/badge/{address}.svg) plus the /mcp endpoint.
    The card declares no protocolVersion and no A2A JSON-RPC task endpoint, so it grades flavored against
    A2A 1.0.0: it is a discovery document for the REST and MCP surfaces in AgentCard shape, not a callable
    A2A agent.
  humanURL: https://legit.gonna.bond/
  baseURL: https://legit.gonna.bond
  tags:
  - A2A
  - agent-native
  - x402
  properties:
  - type: AgentCard
    url: a2a/gonna-bond-a2a.yml
  - type: AgentCard
    name: Agent card (provider-hosted, canonical path)
    url: https://legit.gonna.bond/.well-known/agent-card.json
  - type: AgentCard
    name: Agent card (provider-hosted, legacy path)
    url: https://legit.gonna.bond/.well-known/agent.json
