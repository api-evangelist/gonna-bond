description: >-
  LEGIT publishes no pricing page; its prices live in two machine-readable documents (/.well-known/legit
  and /.well-known/x402) and are asserted at call time in the x402 402 challenge, which is where they were
  read. There are no tiers, accounts or subscriptions: every read operation is free, and five verdict
  operations are paid per call in USDC, with the price set per settlement rail. The live 402 on
  2026-09-19 offered exactly the two rails below; the spec's x-guidance also names solana-mainnet at $0.005
  but no Solana offer appeared in accepts[] and /.well-known/legit lists only two rails.
plan_count: 2
