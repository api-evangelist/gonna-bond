  currency: USDC
  billing_period: none
  description: No authentication, no account. check, report, batch-check (1-20 addresses), route, merchant identity, leaderboard, trending, pulse, networks, arena/preview, stats, receipts, watch status and event feed (with the watch id), badge, health, .well-known documents, and the MCP server.
