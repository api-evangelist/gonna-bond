description: >-
  LEGIT has no separate sandbox host, test keys or test mode for its paid operations; every call goes to
  the one production host and paid calls settle real USDC. What it does publish is an opt-in read-side
  demo mode, declared in the OpenAPI parameter descriptions, that returns fabricated illustration data for
  a small fixed set of demo addresses and always marks it as such.
modes:
- name: live
  base_url: https://legit.gonna.bond
  note: The only environment. Free operations need nothing; paid operations need an x402 payment on a mainnet rail (algorand-mainnet or base-mainnet). No testnet rail is offered in the 402 accepts[].
- name: demo (read-side illustration)
  mechanism: 'query parameter demo=true (boolean, default false)'
  operations: [report_v1_report__address__get, batch_check_v1_batch_check_post]
  behaviour: '"Opt-in demo mode: for the five hardcoded demo addresses, return the fabricated illustration report flagged demo=true. Off by default: fabricated data is never served unmarked."'
  response_marker: 'demo: true on DeepReport, Leaderboard, LeaderboardEntry and RouteResponse'
  demo_addresses: null
  note: The five demo addresses are hardcoded server-side and are not published in the spec, the llms.txt or the docs, so none are recorded here.
