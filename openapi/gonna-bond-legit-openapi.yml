                  grade: A+
                  provisional: false
                  tier: settling
                  uptime_pct_7d: 99.8
                  uptime_pct_30d: 99.5
                  latency_p50_ms: 118.0
                  sample_size: 512
                  last_probe_at: '2026-08-09T23:45:00'
                series:
                - day: '2026-08-09'
                  sample_count: 24
                  ok_count: 24
                  uptime_pct: 100.0
                  latency_avg_ms: 121.4
                  latency_min_ms: 98.0
                  latency_max_ms: 210.0
                  score_avg: 97.4
                  score_min: 97.1
                  score_max: 97.8
                  grade: A+
                  meta:
                    coverage: partial
                    provenance:
                      measurements: raw
                      score: score_table
                backstop:
