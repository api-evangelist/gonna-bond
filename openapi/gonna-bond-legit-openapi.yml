  /v1/deep-check:
    post:
      summary: Run deep-check due diligence on up to 10 addresses
      description: 'Bulk due diligence for up to 10 x402 merchants in one call.


        Every tracked address returns the full trust snapshot with the

        complete parsed score breakdown, a compact 30-day history (daily

        uptime, average score and modal grade), its rank percentile within

        its own network, first/last seen timestamps and its probe tier.

        Untracked addresses are listed honestly under "untracked"; nothing is

        silently dropped and nothing is invented. Tracked merchants stale for

        their probe tier queue an on-demand re-probe each.


        Wave 40 (La Voce, W5): Base merchants with at least one real USDC

        settle found by LEGIT''s independent eth_getLogs chain scan over the

        last 7 days carry an additive "evidence" block

        ({"base_usdc_settles_7d": n, "evidence_source":

        "independent_chain_scan"}). It is omitted for everyone else: absence

        of proof is not proof of absence. Metadata only, never a scoring

        input; a scan failure omits the field, never an error. Paid: $0.004 on Algorand / $0.005 on Base, via x402 (per call in USDC on algorand-mainnet or base-mainnet; the 402 response lists every active rail). The POST /v1/watch 7-day diagnostic tier pays the same per-call rail price as the 30-day watch.'
