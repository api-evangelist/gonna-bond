      summary: Discover LEGIT's endpoints, pricing and rails
      description: 'Machine-readable service document: endpoints, pricing, rails.


        Wave 37 (The Aligned Docs): this document must say what production

        does. The free tier below is served without payment today; the premium

        tier (compare, arena, history, watch, deep-check) answers 402 with

        x402 offers at the real prices when the operator lists it in

