    ReceiptEntry:
      properties:
        txid:
          type: string
          title: Txid
        payer:
          type: string
          title: Payer
        amount_usd:
          type: number
          title: Amount Usd
        ts:
          type: string
          title: Ts
        network:
          type: string
          title: Network
